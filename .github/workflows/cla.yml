name: CLA

# Contributor License Agreement check.
#
# DRADIS is dual-licensed: AGPL-3.0 for open-source use, commercial licenses on
# request. Offering a commercial license requires the right to relicense every
# line in the tree — including contributions from other people. A CLA is what
# grants that right.
#
# This is why a DCO (Developer Certificate of Origin) is NOT sufficient here: a
# DCO only certifies that a contributor had the right to submit their work under
# the project's existing licence. It grants no right to relicense it under
# different terms, so a DCO-only project cannot sell commercial licences that
# cover contributed code.
#
# Uses contributor-assistant/github-action, the successor to the original
# cla-assistant action. Signatures are stored in this repository on a dedicated
# `cla-signatures` branch, so there is no third-party service holding the record.
# That upstream action was archived on 2026-03-23 and is now read-only, so the
# `v2.6.1` pin below is effectively permanent — no upstream fixes are coming.
#
# The `cla-signatures` branch must already exist. The action never creates it: it
# passes the branch straight to the GitHub contents API as a ref, so a missing
# branch fails every run with `Branch cla-signatures not found` for every
# contributor. It was bootstrapped as an orphan commit with an empty tree; the
# action creates `signatures/cla.json` itself on the first signature. If the
# branch is ever deleted, recreate it before expecting the check to pass:
#
#   git branch cla-signatures $(git commit-tree $(git mktree </dev/null) -m init)
#   git push origin cla-signatures

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

# `pull_request_target` runs with a token that can write to this repository, so
# keep the grants to exactly what the action needs. Note that this event checks
# out the BASE of the pull request, never the contributor's code — the action
# only reads metadata and comments, so a fork cannot use it to run code here.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    # Only act on the signature phrase, or on real pull requests. Without this
    # guard every comment on every issue would spin up a runner.
    if: >-
      (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
      github.event_name == 'pull_request_target'
    steps:
      - name: Check or record CLA signature
        uses: contributor-assistant/github-action@v2.6.1
        env:
          # Provided automatically. Used both to comment on the pull request and
          # to write the signature file — the `contents: write` grant above is
          # what authorizes that write.
          #
          # No PERSONAL_ACCESS_TOKEN is set here on purpose. The action only
          # reaches for one when signatures live in a different repo or org
          # (`remote-repository-name` / `remote-organization-name`); with
          # same-repo storage it always uses GITHUB_TOKEN, so a PAT would be
          # inert. Set one only if the signature store ever moves out of here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/mbordash/DRADIS/blob/main/docs/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'mbordash,dependabot[bot],renovate[bot]'
          custom-notsigned-prcomment: >-
            Thanks for the pull request — this is the last bit of paperwork.

            DRADIS is dual-licensed (AGPL-3.0 plus commercial licenses), which means
            the project needs your permission to license your contribution under both.
            Please read the [Contributor License Agreement](https://github.com/mbordash/DRADIS/blob/main/docs/CLA.md),
            then post a comment on this pull request with exactly:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: '✅ All contributors have signed the CLA.'
          lock-pullrequest-aftermerge: false
