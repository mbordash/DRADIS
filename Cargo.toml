[package]
name = "dradis"
version = "1.0.9"
edition = "2021"
license = "AGPL-3.0-only"
description = "Low-latency Rust prediction-market trading bot for Polymarket. Six autonomous strategies (Momentum, Maker, Arbitrage, Time Decay, Basis, GBoost ML), real-time Next.js Control Tower, and an LLM Advisor that delivers optimization recommendations via Ollama (local or remote) + Telegram."

# ── Venue selection (see docs/VENUE_ABSTRACTION.md) ──────────────────────────
# Exactly one venue feature must be active per build.  `intl_clob` is the
# self-custody Polymarket international CLOB (EIP-712 signing over Polygon).
# `us_retail` is the custodial, CFTC-regulated US platform (web2 auth, no signer).
# `kalshi` is the CFTC-regulated Kalshi exchange (RSA-PSS request signing) with
# hourly + 15-min crypto strike markets.
# The intl-only crypto deps (`alloy`, the Polymarket SDK) are gated behind
# `intl_clob` so other venue builds do not drag them into their dependency trees.
[features]
default   = ["intl_clob"]
intl_clob = ["dep:polymarket_client_sdk_v2", "dep:alloy"]
us_retail = ["dep:polymarket-us"]
kalshi    = ["dep:rsa"]

[dependencies]
polymarket_client_sdk_v2 = { version = "0.7.0", optional = true, features = ["clob", "ws", "data", "ctf"] }
alloy = { version = "1.3", optional = true, features = ["signer-local"] }
polymarket-us = { version = "0.8.0", optional = true }
rsa = { version = "0.9", optional = true, features = ["sha2"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
dashmap = { version = "6", features = ["serde"] }
dotenv = "0.15"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust_decimal = "1.36"
rust_decimal_macros = "1.36"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
futures = "0.3"
# `query` is needed by `RequestBuilder::query`, which keeps credentials out of
# hand-built URL strings (see `raptors::sports`). It compiled without this on the
# intl and US builds only because a transitive dependency happened to enable the
# feature — Kalshi, which pulls neither, failed to build. Declared explicitly so
# the shared code does not depend on which venue is selected.
reqwest = { version = "0.13.4", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tungstenite = "0.30.0"
url = "2.5.8"
regex = "1.12.3"
urlencoding = "2.1.3"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
async-trait = "0.1"
perpetual = "3.0.0-rc.2"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

[profile.release]
# Line tables in release builds, so a stall dump names source lines.
#
# The OS watchdog dumps thread stacks when the trading loop goes silent, and on
# 2026-08-25 that caught a real deadlock on a tokio watch channel: the price
# raptor waiting to write while the tide raptor and a squadron patrol queued
# behind it as readers. The stacks were there, but the binary carried no
# symbols, so `atos` returned mangled names with no file or line and the task
# actually holding the read guard could not be identified.
#
# `1` is line tables only — enough to map an address to file:line, without the
# full variable and type information of `2`. Debug info does not change code
# generation, so the binary this produces executes exactly as before; it is
# only larger on disk.
debug = 1
# Keep the debug info in a companion .dSYM on macOS rather than inflating the
# executable. Ignored on Linux, where the AMI build carries it in the binary.
split-debuginfo = "packed"
