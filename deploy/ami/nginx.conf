# TLS terminator for the Control Tower.
#
# The Control Tower authenticates with HTTP Basic, which base64-encodes rather
# than encrypts — over plaintext HTTP the login and every credential typed into
# the Setup view cross the network readable. That is unacceptable on an instance
# reachable from the internet, so nothing is served on 80 except a redirect.
#
# The certificate is self-signed and generated per instance on first boot, so
# browsers show an interstitial warning. That is the honest trade: a warning the
# operator clicks through once, against credentials in clear on every request.
# Customers who want a trusted certificate put this behind an Application Load
# Balancer with ACM, which is the documented path.

server {
    listen 80 default_server;
    server_name _;
    # 302 rather than 301: a customer who later fronts this with an ALB should
    # not be fighting a permanent redirect cached in every browser they own.
    return 302 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/dradis/tls/cert.pem;
    ssl_certificate_key /etc/dradis/tls/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:4m;
    ssl_session_timeout 1h;

    # The Setup view posts wallet keys and API secrets; keep them out of caches.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "SAMEORIGIN"       always;

    # A config bundle export can be sizeable, and an import is a whole upload.
    client_max_body_size 32m;

    location / {
        proxy_pass http://control-tower:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Log streaming and any future SSE need the connection left alone.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
