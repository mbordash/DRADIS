# DRADIS engine + Control Tower — AMI runtime stack.
#
# Installed to /opt/dradis on the AMI; started by dradis.service on boot.
# /opt/dradis/.env is generated on first boot by dradis-firstboot.sh:
#   CT_USERNAME / CT_PASSWORD  — Control Tower login (password = EC2 instance ID)
#   DRADIS_API_KEY             — random; CT proxy → engine auth
#
# The engine API (9000) binds to localhost only — the Control Tower proxy on
# port 80 is the sole public surface. Operator credentials are entered through
# the Setup view and persist in /opt/dradis/data/secrets.env.
#
# Venue selection is NOT set here. The image carries one binary per venue and
# /app/entrypoint.sh reads /opt/dradis/data/venue (seeded on first boot, changed
# from the Setup view). Setting DRADIS_VENUE in .env would be ignored while that
# file exists — see deploy/entrypoint.sh for the full resolution order.

services:
  dradis:
    image: dradis-engine:latest
    container_name: dradis
    restart: always
    env_file: .env
    environment:
      - API_PORT=9000
      - DRADIS_DATA_DIR=/app/data
      - ASSETS=btc
      # Marks this as the paid Marketplace image. The Control Tower uses it to
      # show commercial support contacts instead of the community "no individual
      # support, file a GitHub issue" wording, which AWS would not accept on a
      # product a customer paid for.
      - DRADIS_EDITION=marketplace
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:9000:9000"
    networks: [dradis-net]

  control-tower:
    image: dradis-control-tower:latest
    container_name: dradis-ct
    restart: always
    env_file: .env
    environment:
      - DRADIS_API_URL=http://dradis:9000
      - NEXT_PUBLIC_DEPLOYMENT_ENV=production
    # No host port. The only way in is through the TLS terminator below, so the
    # Control Tower cannot be reached in plaintext even by accident.
    expose:
      - "3002"
    depends_on: [dradis]
    networks: [dradis-net]

  # TLS terminator. See nginx.conf for why this exists rather than serving the
  # Control Tower directly: Basic Auth over plaintext puts the login and every
  # credential entered in Setup on the wire in readable form.
  proxy:
    image: nginx:alpine
    container_name: dradis-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/tls:/etc/dradis/tls:ro
    depends_on: [control-tower]
    networks: [dradis-net]

networks:
  dradis-net:
    driver: bridge
